repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      # The trailing `--` is load-bearing. pre-commit appends filenames to the entry, and
      # `bash -c SCRIPT a b` binds a to $0, not $1 — so `"$@"` would drop the first file, and a
      # commit touching a single .tf file would validate nothing and still report Passed. The
      # `--` takes the $0 slot so the files start at $1.
      #
      # Directories are deduplicated because a module change is usually main.tf + variables.tf +
      # outputs.tf together, and `terraform init` is far too slow to run three times for one module.
      - id: terraform-validate
        name: terraform validate
        entry: bash -c 'rc=0; for dir in $(printf "%s\n" "$@" | xargs -n1 dirname | sort -u); do (cd "$dir" && terraform init -backend=false -input=false -no-color >/dev/null && terraform validate -no-color) || rc=1; done; exit $rc' --
        language: system
        pass_filenames: true
        files: ^infra/.*\.(tf|tfvars)$
      - id: python-compile
        name: python compile
        entry: python3 -m py_compile
        language: system
        files: \.py$
