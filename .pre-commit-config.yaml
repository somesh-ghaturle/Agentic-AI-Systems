repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: terraform-validate
        name: terraform validate
        entry: bash -c 'for file in "$@"; do dir=$(dirname "$file"); (cd "$dir" && terraform init -backend=false -input=false -no-color 2>/dev/null; terraform validate -no-color); done'
        language: system
        pass_filenames: true
        files: ^infra/.*\.(tf|tfvars)$
      - id: python-compile
        name: python compile
        entry: python3 -m py_compile
        language: system
        files: \.py$
