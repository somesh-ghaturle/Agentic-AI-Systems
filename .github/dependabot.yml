# Update signal for pinned dependencies.
#
# Every example's requirements.txt is pinned to an exact version, which is deliberate: these
# examples are read and copied more often than they are run, and an unpinned example that
# resolves differently every month teaches nothing reproducible.
#
# The cost of that choice is that a pin is a snapshot of one afternoon's PyPI. It does not rot
# loudly. `rag-langchain` and `langchain-agent` sat in this repository importing a LangChain
# v0.x API that the pinned version had already deleted, and nothing said so until a human read
# the files. The `example deps` job in checks.yml now catches a pin that is *broken*; this file
# is the other half, catching a pin that is merely *old*.
#
# Grouped aggressively. Five example directories on a weekly cadence with one PR per package
# would be a few dozen pull requests a month against a repository whose examples change rarely,
# and a review queue that noisy gets muted, which is the same outcome as not having it.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Python examples
  # ---------------------------------------------------------------------------
  #
  # Every directory with a non-empty requirements.txt. checkpoint-agent, context-compaction,
  # harness-agent, hermes-agent, multi-agent-debate, starter-agent, tool-discovery, and
  # examples/trace-eval are stdlib-only by design — their requirements files exist to say so —
  # and pointing Dependabot at an empty file achieves nothing.
  #
  # hermes-dashboard points at backend/ because that is where the FastAPI app and its
  # requirements.txt live; the compose file and README both install from there.
  - package-ecosystem: pip
    directories:
      - /examples/e2e-agent
      - /examples/graph-agent
      - /examples/hermes-dashboard/backend
      - /examples/langchain-agent
      - /examples/memory-agent
      - /examples/rag-faiss
      - /examples/rag-langchain
      - /examples/ray-orchestrator
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR per example per month rather than one per package. The examples share pins
      # across directories — sentence-transformers and faiss-cpu appear in both rag-* trees,
      # langchain-core in both LangChain trees — so ungrouped updates would also arrive as
      # near-duplicate PRs that have to be merged in step or not at all.
      example-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: deps
    labels:
      - dependencies

  # ---------------------------------------------------------------------------
  # Service dependencies
  # ---------------------------------------------------------------------------
  #
  # services/trace-eval-service exposes the repository's trace evaluation logic as a small
  # FastAPI service for local development and CI smoke checks. It is a deployable service, not
  # an example, so it gets its own group rather than sharing "example-dependencies" — grouping
  # it with the examples would mislabel what the PR is actually bumping.
  #
  # /tests rides along: tests/requirements.txt pins the same FastAPI, OpenTelemetry and HTTP
  # packages so the fast job can import the service, and a bump that reaches only one of the
  # two files tests a version nobody ships.
  - package-ecosystem: pip
    directories:
      - /services/trace-eval-service
      - /tests
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      service-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: deps
    labels:
      - dependencies

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  #
  # The ecosystem people forget. The workflows pin every action to a major tag, and those age
  # exactly the way a requirements.txt does — with the added property that a deprecated runner
  # action starts emitting warnings and then stops working, rather than failing cleanly.
  #
  # No versions are named here, for the same reason the Terraform section below gives. This
  # comment used to list checkout@v4, setup-python@v5 and setup-terraform@v3; Dependabot's own
  # pull requests then moved them to v7, v7 and v4, and the comment sat wrong until someone
  # read it. The pins live in the workflow files.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # ---------------------------------------------------------------------------
  # Terraform providers
  # ---------------------------------------------------------------------------
  #
  # This entry used to carry a caveat saying it would open approximately zero pull requests,
  # because every required_providers block declared a floor and Dependabot only raises a
  # constraint that actually excludes the newest release. Constraints now pin, so it works:
  # the first run after that change bumped providers across 22 directories.
  #
  # The decision behind the pins, recorded in task 21 of docs/REPO-AUDIT.md: these trees are
  # read and copied more often than they are applied, and a reader running `terraform init` on
  # a floor gets whatever shipped that morning, against which CI's green check said nothing.
  # The cost accepted in exchange is that the trees fall behind until someone merges the PR
  # this entry opens — which is the point of pointing Dependabot at them.
  #
  # No version numbers are named here on purpose. The previous version of this comment listed
  # every constraint, and the first Dependabot merge made it wrong. The constraints live in
  # the .tf files, the resolved versions live in the 17 committed `.terraform.lock.hcl`
  # files, and `.github/scripts/tfconstraints.py` is what enforces the rule about them.
  #
  # Note that Dependabot writes `~> 6.58`, not `~> 6.0` — it floors at the current *minor*
  # when it does rewrite a constraint. `~> 6.58` still admits every later 6.x, so in-major
  # releases arrive as lock-file updates and the constraint only moves on a major.
  #
  # Directory list. Every ROOT, and no module. A root is a directory with a committed
  # `.terraform.lock.hcl`: every `envs/*` in all five trees, plus the three bootstraps.
  #
  # Modules are left out on purpose, and including them is what broke this entry. Every run
  # from 2026-09-26 on failed with "Previous version was not provided for: hashicorp/google",
  # starting with the first run after the module-level lock files were deleted (see
  # docs/REPOSITORY-DISCREPANCIES.md, "Consolidation decisions"). A module directory has a
  # constraint and no lock, so for an in-range release Dependabot has no previous version to
  # report and the whole grouped update errors — taking the roots down with it. So for two
  # months nothing here was bumped while the entry looked configured.
  #
  # Leaving modules out loses nothing for the updates this entry actually makes. Every
  # constraint here is `~> <major>.<minor>`, which admits every later release of the same
  # major, so a routine bump changes lock files and no constraint. A new MAJOR is the one
  # update that needs constraint edits, in roots and modules together, and that is a
  # deliberate change for a human: `tfconstraints.py` fails CI until every declaration of the
  # provider agrees, which is what makes a half-done major bump impossible to merge.
  - package-ecosystem: terraform
    directories:
      - /infra/terraform-aws/envs/*
      - /infra/terraform-azure/envs/*
      - /infra/terraform-gcp/envs/*
      - /infra/terraform-snowflake/envs/*
      - /infra/terraform-hybrid/envs/*
      # The remote-state bootstraps: one root per cloud, outside envs/ and modules/.
      - /infra/terraform-aws/bootstrap
      - /infra/terraform-azure/bootstrap
      - /infra/terraform-gcp/bootstrap
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      providers:
        patterns:
          - "*"
    commit-message:
      prefix: deps
    labels:
      - dependencies

  # ---------------------------------------------------------------------------
  # npm
  # ---------------------------------------------------------------------------
  #
  # The two package.json files in the tree: the hermes-dashboard frontend (React, Vite) and
  # the diagram renderer (puppeteer). Both commit a lock file and neither was watched, so a
  # vulnerable transitive dependency in either would have stayed until someone read the lock.
  - package-ecosystem: npm
    directories:
      - /examples/hermes-dashboard/frontend
      - /scripts/diagram-gif
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: deps
    labels:
      - dependencies

  # ---------------------------------------------------------------------------
  # Container base images
  # ---------------------------------------------------------------------------
  #
  # Every Dockerfile pins its base image by digest, so the image that built yesterday is the
  # image that builds today. The cost is the same as every other pin here: a digest does not
  # pick up a patched base on its own. This entry is what moves it.
  #
  # Minor and major bumps are ignored. The Python minor each image names is a documented floor
  # (e2e-agent's 3.11 is in QUICKSTART.md), and raising one is a decision about the example,
  # not a dependency update. What remains is the digest behind the same tag.
  - package-ecosystem: docker
    directories:
      - /examples/e2e-agent
      - /examples/edge-agent
      - /examples/rag-langchain
      - /examples/starter-agent
      - /services/trace-eval-service
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      base-images:
        patterns:
          - "*"
    commit-message:
      prefix: deps
    labels:
      - dependencies
