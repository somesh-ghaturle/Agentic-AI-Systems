# Update signal for pinned dependencies.
#
# Every example's requirements.txt is pinned to an exact version, which is deliberate: these
# examples are read and copied more often than they are run, and an unpinned example that
# resolves differently every month teaches nothing reproducible.
#
# The cost of that choice is that a pin is a snapshot of one afternoon's PyPI. It does not rot
# loudly. `rag-langchain` and `langchain-agent` sat in this repository importing a LangChain
# v0.x API that the pinned version had already deleted, and nothing said so until a human read
# the files. The `example deps` job in checks.yml now catches a pin that is *broken*; this file
# is the other half, catching a pin that is merely *old*.
#
# Grouped aggressively. Five example directories on a weekly cadence with one PR per package
# would be a few dozen pull requests a month against a repository whose examples change rarely,
# and a review queue that noisy gets muted, which is the same outcome as not having it.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Python examples
  # ---------------------------------------------------------------------------
  #
  # Only the five directories with a non-empty requirements.txt. hermes-agent, starter-agent,
  # and trace-eval are stdlib-only by design — their requirements files exist to say so — and
  # pointing Dependabot at an empty file achieves nothing.
  - package-ecosystem: pip
    directories:
      - /examples/e2e-agent
      - /examples/langchain-agent
      - /examples/rag-faiss
      - /examples/rag-langchain
      - /examples/ray-orchestrator
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR per example per month rather than one per package. The examples share pins
      # across directories — sentence-transformers and faiss-cpu appear in both rag-* trees,
      # langchain-core in both LangChain trees — so ungrouped updates would also arrive as
      # near-duplicate PRs that have to be merged in step or not at all.
      example-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: deps
    labels:
      - dependencies

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  #
  # The ecosystem people forget. checks.yml pins actions/checkout@v4,
  # actions/setup-python@v5, and hashicorp/setup-terraform@v3, and those age exactly the way
  # a requirements.txt does — with the added property that a deprecated runner action starts
  # emitting warnings and then stops working, rather than failing cleanly.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # ---------------------------------------------------------------------------
  # Terraform providers
  # ---------------------------------------------------------------------------
  #
  # This entry used to carry a caveat saying it would open approximately zero pull requests,
  # because every required_providers block declared a floor (`>= 5.0`) and Dependabot only
  # raises a constraint that actually excludes the newest release. That is no longer true.
  # Every block in the three trees now pins to a major — `~> 5.0` for aws and azurerm, `~> 3.0`
  # for azuread, `~> 6.0` for google, `~> 3.6` for random — so a new major opens a PR here.
  #
  # The decision behind that, recorded in task 21 of docs/REPO-AUDIT.md: these trees are read
  # and copied more often than they are applied, and a reader running `terraform init` on a
  # floor gets whatever shipped that morning, against which CI's green check said nothing. The
  # cost accepted in exchange is that the trees fall behind a major until someone merges the PR
  # this entry opens — which is the point of pointing Dependabot at them.
  #
  # The pin names the major; `.terraform.lock.hcl` in each of the seven roots names the exact
  # version, and all seven are committed. Both halves are required: the constraint bounds what
  # `init` may resolve, the lock records what it did.
  #
  # `/infra/terraform-aws` and `/infra/terraform-azure/modules/*` are absent on purpose. The AWS
  # tree has no tree-level .tf files (it declares in each main.tf), and the Azure modules
  # declare no required_providers at all, inheriting from whichever root calls them.
  - package-ecosystem: terraform
    directories:
      - /infra/terraform-aws/envs/*
      - /infra/terraform-aws/modules/*
      - /infra/terraform-azure
      - /infra/terraform-azure/envs/*
      - /infra/terraform-gcp
      - /infra/terraform-gcp/envs/*
      - /infra/terraform-gcp/modules/*
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      providers:
        patterns:
          - "*"
    commit-message:
      prefix: deps
    labels:
      - dependencies
