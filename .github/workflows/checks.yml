# Static checks on the Terraform trees under infra/ and the example suites under tests/.
#
# This repo is reference material: the configurations here are read and copied far more
# often than they are applied. That inverts the usual reason for CI. Production infra
# tells you it is broken at apply time, loudly. A teaching repo stays quietly wrong until
# someone copies the HCL and cannot work out why it will not plan — and assumes the
# mistake is theirs. `terraform validate` is the only thing that notices.
#
# The same argument covers the examples, which is why this file is named `checks` rather
# than `terraform`: hermes-agent's write boundary and trace-eval's graders are the claims
# those examples exist to make, and until this workflow ran them a broken boundary merged
# green.
#
# Everything here runs without cloud credentials. That is a constraint worth keeping:
# a check that needs a subscription is a check that gets disabled the first time a
# secret expires.
#
# The path filters now include docs/ and the root markdown files, which they did not until
# 2026-08-15. This repository is mostly documentation by volume and by purpose, and until that
# change a documentation-only commit ran no checks at all. REPO-AUDIT Task 12 was two broken
# links to a workflow that had been renamed, merged
# green, and found by a human reading the file. See round-two Task 17.

name: checks

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "examples/**"
      - "services/**"
      - "tests/**"
      - "docs/**"
      - "*.md"
      - ".github/scripts/**"
      # Every workflow, not just this one. Naming checks.yml alone left a gap with teeth: a
      # change to example-deps.yml, docs-preview.yml, or codeql.yml reached main with no run
      # at all, and a workflow edit is exactly the change most able to disable a check while
      # looking like it tightened one. The same reasoning covers .pre-commit-config.yaml,
      # whose hooks are the only gate on a commit made with --no-verify off.
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
      - ".gitleaks.toml"
      - "pyproject.toml"
      - ".tflint.hcl"
      - ".checkov.yaml"
  pull_request:
    paths:
      - "infra/**"
      - "examples/**"
      - "services/**"
      - "tests/**"
      - "docs/**"
      - "*.md"
      - ".github/scripts/**"
      # Every workflow, not just this one. Naming checks.yml alone left a gap with teeth: a
      # change to example-deps.yml, docs-preview.yml, or codeql.yml reached main with no run
      # at all, and a workflow edit is exactly the change most able to disable a check while
      # looking like it tightened one. The same reasoning covers .pre-commit-config.yaml,
      # whose hooks are the only gate on a commit made with --no-verify off.
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
      - ".gitleaks.toml"
      - "pyproject.toml"
      - ".tflint.hcl"
      - ".checkov.yaml"

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the version this repository is actually developed on, not a floor.
      #
      # These two jobs used to pin 1.9.8 while every contributor ran 1.15.x. `fmt` agreed
      # across that gap and all seven roots validated on both, so nothing was broken — but
      # nothing was checking either, and the first divergence would have surfaced in CI on
      # a change that had nothing to do with it. The modules keep `required_version = ">= 1.6"`
      # deliberately: that is the floor a consumer copying this HCL must clear, and it is a
      # different question from which single version CI proves the trees against.
      #
      # Raise this and the pin in `validate` together — they are the same decision.
      #
      # Pinned by commit SHA rather than the `v4` tag: this is the only third-party action in
      # the file, and a tag is mutable, so whoever controls it controls a step that runs before
      # the Terraform trees are read. The `actions/*` and `github/*` uses are GitHub-owned
      # immutable releases, which is why those keep their tags. Bump the SHA and the trailing
      # version comment together, or the comment starts lying about what actually runs.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # For the provider-pins step below. The runner ships a python3, but every other Python
      # step in this file names its version rather than inheriting whatever the image moved to.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # One pass over all four trees — formatting has no per-root component.
      - name: fmt
        run: terraform fmt -recursive -check -diff infra/

      # Guards the decision in REPO-AUDIT task 21: every provider constraint pins a major,
      # and every declaration of the same provider agrees. Both failures are invisible to
      # `validate` — a floor resolves fine, it just resolves to something different next
      # month, and a half-finished bump resolves fine too — so nothing else here catches
      # them.
      #
      # This started as an inline grep for floors and was not enough. Within a day Dependabot
      # bumped hashicorp/google across 22 directories and left a tree-level versions.tf
      # behind on the old major, which is a pin, not a floor, and so passed. The script adds
      # the agreement rule and is tested in tests/test_tfconstraints.py, because a guard whose
      # own matching silently breaks reports success.
      - name: provider pins
        run: python3 .github/scripts/tfconstraints.py infra

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pinned for the same reason `terraform_version` above is pinned, and the reason bites
      # harder here: ruff adds rules to existing groups between releases, so an unpinned
      # install is a moving rule set and not just a moving bug-fix stream. `select` in
      # pyproject.toml names groups — E, F, I, B, UP, SIM, C4, RUF — and one new rule inside
      # any of them turns a commit red that nobody touched, on whoever pushes next.
      #
      # Raise this deliberately: run `ruff check .` locally on the new version first and fix
      # what it finds in the same change. Dependabot does not watch this pin, because it is a
      # `pip install` inside a run step rather than a manifest — the same trade the pinned
      # gitleaks version further down already makes.
      - name: Install ruff
        run: pip install ruff==0.16.4

      # The Python half of the parity `terraform fmt -check` above has had all along. Every
      # .tf file in this repository was gated on formatting while the Python files across
      # examples/, infra/*/src/, tests/ and .github/scripts/ were gated on nothing, and that
      # asymmetry is visible to anyone who opens both halves of the repo.
      #
      # No flags on purpose. Every rule lives in pyproject.toml at the root, so the command
      # here is the command a contributor runs locally and reaches the same verdict. A flag
      # set only in the workflow is a rule that fails for the first time in CI, on someone
      # who had no way to see it coming.
      #
      # `ruff format` is deliberately NOT run. It would rewrite most of the Python files in one
      # commit, and in a repository whose Python exists to be read — where `git blame` is the
      # record of why each example looks the way it does — that costs more than the uniformity
      # buys. E501 at line-length 100 already holds the one formatting property that matters
      # for reading two files side by side.
      - name: Lint
        run: ruff check .

      # Mermaid diagrams stay as source in markdown fences. A raw `.mmd` file or an empty
      # ` ```mermaid ` block is a drift away from the source-of-truth path this repo chooses.
      - name: Mermaid source guard
        run: python3 .github/scripts/mermaid_guard.py .

  validate:
    name: validate
    runs-on: ubuntu-latest
    strategy:
      # Report every broken root, not just the first. A learner fixing one wants to
      # know whether the others are also affected.
      fail-fast: false
      matrix:
        root:
          - infra/terraform-aws/envs/dev
          - infra/terraform-aws/envs/prod
          - infra/terraform-aws/envs/staging
          - infra/terraform-azure/envs/dev
          - infra/terraform-azure/envs/prod
          - infra/terraform-azure/envs/staging
          - infra/terraform-azure/envs/tenant
          - infra/terraform-gcp/envs/dev
          - infra/terraform-gcp/envs/prod
          - infra/terraform-gcp/envs/staging
          - infra/terraform-snowflake/envs/dev
          - infra/terraform-snowflake/envs/prod
          - infra/terraform-snowflake/envs/staging
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Keep in step with the pin in `fmt` above — see the note there.
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # Each root separately: they have different backends and different provider sets,
      # and a module that only one root uses would otherwise go unchecked.
      # -backend=false so no remote state and no credentials are needed.
      - name: init
        run: terraform -chdir="${{ matrix.root }}" init -backend=false -input=false -no-color

      - name: validate
        run: terraform -chdir="${{ matrix.root }}" validate -no-color

  cost-estimate:
    name: cost estimate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Estimate Terraform spend
        run: python3 .github/scripts/terraform_cost_estimate.py infra --threshold 500

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tflint
        env:
          # Pinned with a checksum for the same two reasons the gitleaks pin below is:
          # this step downloads a binary over the network and then runs it against the
          # whole `infra/` tree, and a linter whose rule set can change between two runs
          # of the same commit turns a green build into an unreproducible one. tflint
          # ships the `terraform` ruleset bundled, so there is no `tflint --init` and no
          # second network hop for a plugin.
          #
          # Raise this deliberately: run the sweep below locally on the new version first
          # and fix what it finds in the same change.
          TFLINT_VERSION: "0.64.0"
          TFLINT_SHA256: "cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537"
        run: |
          curl -sSfL -o tflint.zip \
            "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  tflint.zip" | sha256sum -c -
          unzip -o -q tflint.zip tflint
          sudo install tflint /usr/local/bin/tflint

      # Every module directory and every env root, not just the roots. `validate` above
      # already covers the roots, and only the roots — a module is checked there through
      # whichever root happens to call it, with that root's variables. tflint reads each
      # directory on its own terms, which is the only way `modules/networking` gets told
      # it declares no `required_version`: no root was ever going to report that on its
      # behalf.
      #
      # Env roots get --var-file. Without it tflint evaluates `var.tools` as its empty
      # default, `local.tool_members` derives from it and comes out empty, and every
      # `local.tool_members["retrieve"]` in the file reports as an invalid index — six
      # errors across Azure and GCP that describe the empty default rather than the code.
      # terraform.tfvars.example is the file the QUICKSTART tells a reader to copy, so
      # linting against it lints the configuration people actually apply.
      #
      # Rules live in .tflint.hcl at the repository root, so the command a contributor
      # runs locally reaches the same verdict as this one.
      - name: Lint every module and root
        run: |
          failed=0
          for dir in infra/terraform-*/modules/*/ infra/terraform-*/envs/*/; do
            args=(--chdir="$dir" --config="$PWD/.tflint.hcl" --format=compact)
            if [ -f "$dir/terraform.tfvars.example" ]; then
              args+=(--var-file=terraform.tfvars.example)
            fi
            if ! tflint "${args[@]}"; then
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::tflint reported issues in ${failed} directories"
            exit 1
          fi
          echo "tflint clean across all module directories and env roots"

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pinned for the reason the ruff pin above spells out, and one more that is specific
      # to a policy scanner: checkov ships new checks continuously. An unpinned install
      # means the rule set changes under a commit nobody touched, and the failure lands on
      # whoever pushes next rather than whoever caused it.
      #
      # Raise this deliberately. New checks in a new version are the point of raising it —
      # run `checkov --config-file .checkov.yaml` locally first, then either fix what it
      # found or add it to the skip list with a reason, in the same change.
      - name: Install checkov
        run: pip install checkov==3.3.13

      # No `--soft-fail`. This job fails the build on any finding that is not skipped by
      # name in .checkov.yaml, which is what makes the skip list readable as a statement
      # about the architecture rather than as a way to get green. There were 110 findings
      # when this job was written and 9 were fixed rather than skipped; today the list
      # suppresses 99 findings across 44 rules, grouped by what the reason is. The header
      # of .checkov.yaml carries the command that re-measures both numbers.
      #
      # LOG_LEVEL=ERROR because checkov logs a WARNING for every HCL interpolation its
      # Python evaluator cannot parse — several dozen here, all benign, all in front of
      # the result. A failure nobody can find in the log is a failure nobody acts on.
      #
      # Everything else — which directories, which framework, which checks are skipped —
      # lives in .checkov.yaml, so the command a contributor runs locally reaches the same
      # verdict as this one.
      - name: Scan the Terraform trees
        env:
          LOG_LEVEL: ERROR
        run: checkov --config-file .checkov.yaml

  conftest:
    name: conftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install conftest
        env:
          # Pinned with a checksum for the same reasons the tflint and gitleaks pins are:
          # a binary fetched over the network and then run against the whole tree, whose
          # verdict must not change between two runs of the same commit. The pin covers OPA
          # too — conftest 0.62.0 embeds OPA 1.6.0, and OPA 1.0 removed the `deny[msg]`
          # syntax these policies would otherwise have been written in.
          CONFTEST_VERSION: "0.62.0"
          CONFTEST_SHA256: "284231908e4cf66d156e5577c3eee2f67d9f2edf2521fa2309e0df1969f871e5"
        run: |
          curl -sSfL -o conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  conftest.tar.gz" | sha256sum -c -
          tar xzf conftest.tar.gz conftest
          sudo install conftest /usr/local/bin/conftest

      # Parity with `terraform fmt -check` in the fmt job above: the policies are source in
      # this repository like the HCL is, and a formatter nobody runs is a diff waiting to
      # land on top of an unrelated change.
      - name: Policy formatting
        run: conftest fmt --check infra/policies

      # The policies' own unit tests, and they run FIRST on purpose. A policy that cannot
      # fail passes every tree it is pointed at, which looks identical to a policy that
      # holds. `verify` runs the `test_` rules in infra/policies/, each of which asserts
      # both directions: silent on wired config, firing on config missing exactly the
      # wiring reference. Deleting a rule body turns the tree scan below green and turns
      # this step red.
      - name: Policy unit tests
        run: conftest verify --policy infra/policies

      # `--combine` merges every file into one document before evaluating. That is not an
      # optimisation — it is what makes these policies expressible. The resource that
      # declares a guardrail and the resource that wires it are routinely in different
      # files, and a per-file pass can only ever see half of the pair.
      #
      # The file list comes from `find`, not from pointing conftest at the directory,
      # because `--parser hcl2` forces every file it is given through the HCL parser —
      # including .gitignore, .terraform.lock.hcl, and the zips under src/. Naming the
      # .tf files is narrower than an ignore regex and does not need editing the next
      # time a new file type appears under infra/.
      #
      # Per tree rather than all at once, so the failure names the tree it came from.
      - name: Policies over the four trees
        run: |
          failed=0
          for tree in infra/terraform-aws infra/terraform-azure infra/terraform-gcp infra/terraform-snowflake; do
            echo "--- ${tree} ---"
            if ! find "$tree" -name '*.tf' -not -path '*/.terraform/*' -print0 \
              | xargs -0 conftest test --parser hcl2 --combine --policy infra/policies; then
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::conftest reported policy failures in ${failed} trees"
            exit 1
          fi
          echo "conftest clean across all four trees"

  write-boundary:
    name: write boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Four suites, one job — one per tree.
      #
      # All four guard mistakes that `terraform validate` is perfectly happy with, because
      # in each case the wrong value is a valid value in a valid attribute.
      #
      # This job used to skip AWS on the grounds that the boundary there is a Lambda
      # resource policy, so getting it wrong is a plan-time error. That is true of the
      # resource policy and only of it. For a caller in the same account, Lambda grants
      # invocation if the IDENTITY policy allows it or the resource policy does, and the
      # orchestrator's identity policy is built from a list nothing checks. Widening that
      # list to every tool is a one-word edit that plans, validates, and applies cleanly.
      #
      # No dependencies on purpose — stdlib unittest, reading .tf files as text. A check
      # that needs cloud credentials is a check that gets disabled the first time a secret
      # expires.
      #
      # AWS: guards the identity-policy half of the boundary — that no write tool ARN
      # reaches the orchestrator's policy, that the write tools' resource policy names the
      # approval executor rather than states.amazonaws.com, and that the read/write outputs
      # keep their access filters.
      - name: AWS — assert the write boundary holds
        run: python3 -m unittest discover -s infra/terraform-aws/tests -v

      # Azure: guards `app_role_assignment_required`. Set it false and Entra mints a token
      # for any principal in the tenant while every diagram and output still looks correct.
      # See infra/terraform-azure/tests/test_write_boundary.py for why this exists rather
      # than an Azure Policy definition.
      - name: Azure — assert app_role_assignment_required is true everywhere
        run: python3 -m unittest discover -s infra/terraform-azure/tests -v

      # GCP: guards both locks and the five ways each fails silently — chiefly
      # `roles/cloudfunctions.invoker` on a gen2 function, which applies cleanly and
      # controls nothing, and deny policies written with `serviceAccount:` principals,
      # which GCP accepts and matches against nothing.
      - name: GCP — assert the write boundary holds
        run: python3 -m unittest discover -s infra/terraform-gcp/tests -v

      # Snowflake: the boundary is the role graph, which makes it the easiest of the four
      # to break by accident — every way of breaking it is a valid grant that applies
      # cleanly and reads as ordinary permission tidying. The suite walks role inheritance
      # transitively rather than checking pairs, because modules/orchestration adds a
      # legitimate edge (TASK_OWNER inherits EXECUTOR) and a blocklist would either forbid
      # that or miss the dangerous ones two hops out.
      - name: Snowflake — assert the role graph keeps the boundary
        run: python3 -m unittest discover -s infra/terraform-snowflake/tests -v

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -q -r tests/requirements.txt

      # Example suites, one runner, no dependencies — the same reasoning as the
      # write-boundary job above. The test-only dependencies above are limited to the two
      # HTTP-facing suites; the examples themselves remain dependency-free. hermes-agent asserts
      # that a write cannot happen by the
      # router's path; trace-eval asserts that its own checks still catch a run that
      # bypasses it. None of the suites needs a model, a network, or a cloud account, which is
      # what makes them safe to gate merges on.
      # Discovery also picks up tests/smoke/, which runs a subset of the examples as
      # subprocesses with the arguments their READMEs document and asserts the exit code each
      # one promises. That is a different question from the suites above: they import modules,
      # so a `__main__` block that raises is invisible to them, and it is the first thing a
      # user hits. graph-agent's smoke case skips here and runs in example-deps.yml, where
      # langgraph is installed.
      #
      # hermes-agent appears three times there, and the middle one expects exit **2** — the
      # write boundary refusing an unapproved action. It is the only runtime assertion in this
      # workflow that the boundary actually holds when the example is run rather than imported.
      #
      # Discovery also picks up tests/performance/, whose ceilings sit ~20x above measured cost
      # on purpose. They are not latency targets — a test asserting 40ms would fail whenever
      # this runner was busy, get called flaky, and get deleted. At 20x they still catch the
      # regression that actually threatens a stdlib-only example: something started doing I/O.
      - name: Example suites, and the examples run
        run: python3 -m unittest discover -s tests -v

      # Every example, not just the ones with suites. langchain-agent, rag-langchain, and
      # ray-orchestrator still have none. Before this step existed, most of the early examples
      # were verified by nothing at all, which is how two of them sat here importing a LangChain
      # v0.x API that the pinned version had already deleted while this workflow stayed green.
      #
      # compileall parses without importing, so it needs none of their dependencies and
      # finishes in about a second. That is what makes it affordable here, on the unfiltered
      # path, next to the stdlib suites above.
      #
      # It catches the example edited in place and never run again. It cannot catch a
      # dependency that stopped exporting a name, because parsing is not importing — that is
      # `example-deps.yml`, which lives in its own file because it needs a different trigger:
      # it installs Torch and Ray, so it must fire on changes to examples/ and not on every
      # commit to infra/.
      - name: All examples — syntax
        run: python3 -m compileall -q examples/

      # Every third-party module an example imports must be pinned in its own
      # requirements.txt, and no example may import another in a cycle.
      #
      # The first half is the one that bites. graph-agent imported typing_extensions while
      # pinning only langgraph, and passed everything above — compileall parses without
      # importing, and the example-deps job installs langgraph, which drags typing-extensions
      # in transitively. Nothing here runs an example against only what it declares, so an
      # undeclared import is invisible until someone installs it from its requirements file
      # and it fails for them and not for us.
      #
      # The second half is currently one edge: trace-eval evaluates hermes-agent by putting
      # the sibling directory on sys.path. That is deliberate and fine in one direction; the
      # check is here so the return edge cannot be added silently.
      #
      # Tested in tests/test_example_deps.py, because a guard whose name matching breaks
      # reports success on everything.
      - name: Example dependencies are declared, and acyclic
        run: python3 .github/scripts/example_deps.py examples

  # The README badge says "Python 3.9+" and nine example READMEs repeat it. Until this job
  # existed nothing checked it: every other job here pins 3.12, so the floor was a claim the
  # repository made about itself and never tested. That is the same defect this tree keeps
  # finding in its own work — task 5's secret-scan job that ran a removed subcommand, task 47's
  # dependency guard that named one of four imports — a check that looks present and verifies
  # nothing.
  #
  # Deliberately installs nothing. The claim being tested is the zero-dependency one, so the
  # suites that need fastapi or opentelemetry skip here by their own guards rather than being
  # excluded by name from this file; a list of exclusions in a workflow goes stale silently,
  # a guard beside the import does not. tests/test_example_deps.py skips too, on version: the
  # script it tests reads sys.stdlib_module_names, which is 3.10+.
  #
  # If this job becomes a burden, that is the signal to raise the floor rather than to delete
  # the job — and at that point the badge, QUICKSTART.md, and the example READMEs move with it.
  examples-py39:
    name: examples (3.9 floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Example suites on the advertised floor
        run: python3 -m unittest discover -s tests

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Relative links only, and that is deliberate. External URLs rot for reasons nobody here
      # controls, and a job that goes red because someone else's blog moved is a job that gets
      # switched off — taking the useful half of the check with it.
      #
      # The script skips fenced code blocks and strips #fragments. Both matter more than they
      # sound: a naive version of this check reported 34 broken links in this repository and
      # every one was a false positive, because the audit and plan documents quote other
      # files' markdown inside fences, and `FILE.md#anchor` is a valid link to a file that
      # exists. The script's docstring carries the detail.
      - name: Relative links resolve
        run: python3 .github/scripts/linkcheck.py .

      # The counts the prose states, against the counts the tree has. `a2faa35` was titled
      # "Fix eight stale claims found in full-repo sweep", and the README had drifted again by
      # the next audit — twelve jobs when there were fourteen, twelve examples when there were
      # twenty-three. Hand-fixing a number resets the clock; this stops it. It caught a stale
      # diagram count in the same commit that added it.
      - name: Documented counts match the tree
        run: python3 .github/scripts/docs_counts.py .

      # The chapter/example pairing ROADMAP.md calls "the thing to protect", checked rather
      # than asserted. It found seven drifts on its first run, five of them one-directional:
      # a chapter naming a counterpart whose README had never pointed back.
      - name: Chapters and their runnable counterparts agree
        run: python3 .github/scripts/pairing.py .

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans git history, and checkout defaults to fetch-depth: 1. A
          # shallow clone hands the scanner a single commit, so a credential that was
          # committed and then deleted three commits later scans clean — which is the
          # one case history scanning exists to catch. Verified locally: the same repo
          # reports 56 commits scanned at full depth and 1 when cloned with --depth 1.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          # Pinned, not `@latest`. A scanner whose ruleset can change between two runs
          # of the same commit turns a green build into an unreproducible one, and the
          # failure lands on whoever pushes next rather than whoever caused it. The
          # checksum is here because this step downloads a binary over the network and
          # then runs it against the whole repository.
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        # `gitleaks git` replaces `gitleaks detect`, which 8.30 no longer lists as a
        # command. --redact matters more than it looks: this log is public, so the run
        # that catches a live key must not also be the run that republishes it.
        # Rules and the one allowlisted placeholder live in .gitleaks.toml.
        run: gitleaks git . --redact --verbose

  handlers:
    name: handlers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # terraform-snowflake is absent on purpose: its handler logic is SQL stored
        # procedures defined in modules/approval, so there is no package to build. See
        # infra/terraform-snowflake/ARCHITECTURE.md § "Remaining work" — it is also why
        # that tree has no entry in the `handlers` job.
        tree: [terraform-aws, terraform-azure, terraform-gcp]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The handler logic, one suite per tree. Each stubs its provider SDK rather than
      # installing it — boto3 ships in the Lambda runtime, and the google-cloud and azure-*
      # packages are installed at deploy time by Cloud Build and Oryx respectively, so none
      # of them are dependencies of this repo.
      #
      # What is actually under test is the part that is pure logic anyway, and it is the
      # part where a copied handler goes quietly wrong: the filters that keep retrieval
      # scoped to one tenant, the claim that stops a double-clicked approve button running
      # a refund twice, and the rule that cost appears only on terminal trace records.
      #
      # The three trees deliberately disagree on two field names — AWS and Azure emit
      # `event_type` with a `request_complete` terminal event, GCP emits `event` with a
      # `terminal` flag — because that is what each provider's queries actually match. Each
      # suite asserts its own convention, so a handler copied between trees fails here
      # rather than in production, where it would emit records that parse, look correct,
      # and match no alert.
      - name: ${{ matrix.tree }} — handler logic
        run: python3 -m unittest discover -s infra/${{ matrix.tree }}/src/tests -v

  packages:
    name: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tree: [terraform-aws, terraform-azure, terraform-gcp]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The build scripts are not incidental: every module reads its zips at PLAN time, so
      # a package that cannot be built is a root that cannot be planned. Running them here
      # catches a missing entry point or an undeclared requirements.txt at review time
      # rather than when someone follows HOW-TO-DEPLOY.md.
      #
      # This builds packages; it does not install their dependencies. AWS vendors wheels
      # into the zip and needs pip, so it is the only one whose output is a complete
      # artifact — the other two ship source and let the platform's builder resolve it.
      - name: ${{ matrix.tree }} — build deployment packages
        run: infra/${{ matrix.tree }}/src/build.sh
