name: Render Mermaid Diagrams

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install mermaid-cli
        run: npm install @mermaid-js/mermaid-cli@10

      - name: Render architecture diagram
        run: |
          npx @mermaid-js/mermaid-cli -i examples/e2e-agent/architecture.mmd -o examples/e2e-agent/architecture.svg

      - name: Commit and push SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/e2e-agent/architecture.svg || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: render Mermaid diagrams to SVG [skip ci]" || true
            git push
          else
            echo "No changes to commit"
          fi
