# Static checks on the Azure Terraform tree.
#
# Everything here runs without Azure credentials. That is a constraint worth keeping:
# a check that needs a subscription is a check that gets disabled the first time a
# secret expires.
#
# The write-boundary test is the one with teeth. `terraform validate` is perfectly happy
# with `app_role_assignment_required = false` — it is a valid boolean in a valid
# attribute. Only the test notices that it is also the whole security model.

name: terraform-azure

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform-azure/**"
      - ".github/workflows/terraform-azure.yml"
  pull_request:
    paths:
      - "infra/terraform-azure/**"
      - ".github/workflows/terraform-azure.yml"

permissions:
  contents: read

jobs:
  write-boundary:
    name: write boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies on purpose — stdlib unittest, reading .tf files as text.
      # See infra/terraform-azure/tests/test_write_boundary.py for why this exists
      # rather than an Azure Policy definition.
      - name: Assert app_role_assignment_required is true everywhere
        run: python3 -m unittest discover -s infra/terraform-azure/tests -v

  terraform:
    name: fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -recursive -check -diff
        working-directory: infra/terraform-azure

      # Each root separately: they have different backends and different provider sets,
      # and a module that only one root uses would otherwise go unchecked.
      - name: validate
        working-directory: infra/terraform-azure
        run: |
          set -euo pipefail
          for root in envs/dev envs/prod envs/tenant; do
            echo "::group::$root"
            # -backend=false so no remote state and no credentials are needed.
            terraform -chdir="$root" init -backend=false -input=false -no-color
            terraform -chdir="$root" validate -no-color
            echo "::endgroup::"
          done
