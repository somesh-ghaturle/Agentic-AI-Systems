name: gate

# The one check `main` requires.
#
# checks.yml and example-deps.yml have path filters, and a required check that never starts
# leaves a pull request waiting forever. So the ruleset cannot require their jobs by name: a
# change that matches no filter would be unmergeable. This workflow has no filter. It always
# runs, waits for whatever else started on the same commit, and fails unless all of it passed.
# Requiring this one job therefore requires all the others exactly when they apply.
#
# `pull_request_target`, deliberately. Under `pull_request` the workflow file comes from the
# pull request, so a change could rewrite this gate to pass and be judged by its own edit.
# Under `pull_request_target` the file comes from the base branch: a pull request is always
# judged by the gate that is already on main. That trigger is dangerous when a workflow checks
# out and runs the pull request's code with a privileged token. This one checks out nothing,
# runs no code from the pull request, and holds one permission: reading check results.

on:
  pull_request_target:

permissions:
  checks: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for every other check on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          others() {
            gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --paginate \
              --jq '.check_runs[] | select(.name != "gate") | [.name, .status, (.conclusion // "")] | @tsv'
          }

          # Other workflows need a moment to create their check runs. Without the wait, a
          # commit whose checks had not been queued yet would look like one with none.
          sleep 60

          settled=0
          for _ in $(seq 120); do
            runs=$(others)
            pending=$(printf '%s\n' "$runs" | awk -F'\t' '$1 != "" && $2 != "completed"' | wc -l)
            if [ "$pending" -ne 0 ]; then
              settled=0
              sleep 15
              continue
            fi

            # Fail closed: anything that finished with a conclusion other than these three
            # is a failure, including conclusions this script has never heard of.
            bad=$(printf '%s\n' "$runs" | awk -F'\t' '$1 != "" && $3 != "success" && $3 != "skipped" && $3 != "neutral"')
            if [ -n "$bad" ]; then
              echo "These checks did not pass:"
              printf '%s\n' "$bad"
              exit 1
            fi

            # Everything is complete and green. Look once more after a pause before
            # believing it, so a workflow that was slow to start is not missed.
            settled=$((settled + 1))
            if [ "$settled" -ge 2 ]; then
              count=$(printf '%s\n' "$runs" | awk -F'\t' '$1 != ""' | wc -l)
              echo "All $count other checks on $SHA passed or were skipped."
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for the other checks."
          exit 1
