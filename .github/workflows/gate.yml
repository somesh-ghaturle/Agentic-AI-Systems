name: gate

# The one check `main` requires.
#
# checks.yml and example-deps.yml have path filters, and a required check that never starts
# leaves a pull request waiting forever. So the ruleset cannot require their jobs by name: a
# change that matches no filter would be unmergeable. This workflow has no filter. It always
# runs, waits for whatever else started on the same commit, and fails if any of it failed.
# Requiring this one job therefore requires all the others exactly when they apply.
#
# It reads check results and nothing else, so it needs no secret and no checkout.

on:
  pull_request:

permissions:
  checks: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for every other check on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Other workflows need a moment to create their check runs. Without the wait, a
          # commit whose checks had not been queued yet would look like one with none.
          sleep 45
          for _ in $(seq 120); do
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --paginate \
              --jq '.check_runs[] | select(.name != "gate") | [.name, .status, (.conclusion // "")] | @tsv')
            pending=$(printf '%s\n' "$runs" | awk -F'\t' '$2 != "completed" && $1 != ""' | wc -l)
            if [ "$pending" -eq 0 ]; then
              bad=$(printf '%s\n' "$runs" | awk -F'\t' '$3 == "failure" || $3 == "cancelled" || $3 == "timed_out" || $3 == "action_required"')
              if [ -n "$bad" ]; then
                echo "These checks did not pass:"
                printf '%s\n' "$bad"
                exit 1
              fi
              echo "Every other check on $SHA passed or was skipped."
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for the other checks."
          exit 1
