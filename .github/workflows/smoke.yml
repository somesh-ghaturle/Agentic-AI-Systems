name: Smoke tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r examples/starter-agent/requirements.txt
      - name: Run tests
        run: |
          python -m pytest -q
      - name: Smoke: LangChain agent (fallback)
        run: |
          python examples/langchain-agent/agent.py "Test fallback"
      - name: Smoke: RAG FAISS build + query
        run: |
          pip install -r examples/rag-faiss/requirements.txt
          python examples/rag-faiss/build_index.py
          python examples/rag-faiss/query.py "reproducibility in enterprise ai"
      - name: Smoke: RAG LangChain build + query (no API key required)
        run: |
          pip install -r examples/rag-langchain/requirements.txt
          python examples/rag-langchain/build_index.py
          python examples/rag-langchain/query_and_answer.py "governance needs"
      - name: Smoke: Ray orchestrator
        run: |
          pip install -r examples/ray-orchestrator/requirements.txt
          python examples/ray-orchestrator/orchestrator.py
