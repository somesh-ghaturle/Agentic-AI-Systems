name: docs-preview

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "*.md"
      - ".github/scripts/docs_preview.py"
      - ".github/workflows/docs-preview.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "*.md"
      - ".github/scripts/docs_preview.py"
      - ".github/workflows/docs-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    name: docs preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build static docs preview
        run: python3 .github/scripts/docs_preview.py . docs-preview

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-preview
          path: docs-preview
          if-no-files-found: error
          retention-days: 7
