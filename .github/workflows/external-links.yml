name: external links

# A weekly report on external links that have died, not a check. linkcheck.py excludes external
# URLs from pull requests on purpose: a job that fails because someone else's site moved is a
# job that gets disabled. This one never gates anything. It opens an issue, or adds a comment
# to the one already open, so a dead link is a reminder and not a red build.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: external links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check external links
        id: links
        # `shell: bash` is what turns on pipefail. Without it the step takes tee's exit
        # status, always succeeds, and the issue below is never opened.
        shell: bash
        run: python3 .github/scripts/external_links.py . | tee report.txt
        continue-on-error: true

      - name: Open or update the issue
        if: steps.links.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search "in:title Dead external links" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.txt
          else
            gh issue create --title "Dead external links" --body-file report.txt
          fi
