name: publish-image

# Publishes services/trace-eval-service as ghcr.io/<owner>/trace-eval-service.
#
# Runs on a version tag (v0.1.0 -> :0.1.0, :0.1 and :latest) or by hand from the Actions tab.
# GITHUB_TOKEN carries the packages: write grant, so no personal token or secret is needed.
# The image is started and /healthz checked before anything is pushed: a broken image that
# reaches the registry is pulled by whoever trusted the tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: trace-eval-service image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/trace-eval-service
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/trace-eval-service/Dockerfile
          load: true
          tags: trace-eval-service:smoke

      - name: Smoke test
        run: |
          docker run -d --name svc -p 8000:8000 trace-eval-service:smoke
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8000/healthz && exit 0; sleep 1; done
          docker logs svc
          exit 1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/trace-eval-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
